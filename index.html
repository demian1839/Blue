<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Swipe and Use</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to top, #202020, #404040);
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    #fileInput {
      margin: 20px 0;
    }
    #swipeZone {
      margin-top: 20px;
      padding: 60px;
      background-color: #303030;
      border-radius: 12px;
      font-size: 18px;
      user-select: none;
      max-width: 300px;
    }
    #status {
      margin-top: 20px;
      font-size: 16px;
    }
    #downloadZone {
      margin-top: 30px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Swipe and Use</h1>
  <input type="file" id="fileInput" />
  <div id="swipeZone">↑ Hochwischen zum Senden</div>
  <div id="status">Bereit...</div>
  <div id="downloadZone"></div>

  <!-- Firebase & App Script -->
  <script type="module">
    // Firebase importieren
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Dein Firebase-Config
    const firebaseConfig = {
      apiKey: "AIzaSyD4GkHuMEBD4sqYkMj0etF1BZWi1LJy0h4",
      authDomain: "bluetooth-8693f.firebaseapp.com",
      projectId: "bluetooth-8693f",
      storageBucket: "bluetooth-8693f.firebasestorage.app",
      messagingSenderId: "564117531664",
      appId: "1:564117531664:web:0fb59351fdf6d1f08f2e95",
      measurementId: "G-SCKTS3WFXK",
      databaseURL: "https://bluetooth-8693f-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const fileInput = document.getElementById("fileInput");
    const swipeZone = document.getElementById("swipeZone");
    const status = document.getElementById("status");
    const downloadZone = document.getElementById("downloadZone");

    let selectedFile = null;
    let touchStartY = 0;

    fileInput.addEventListener("change", (e) => {
      selectedFile = e.target.files[0];
      status.textContent = `Datei gewählt: ${selectedFile.name}`;
    });

    swipeZone.addEventListener("touchstart", (e) => {
      touchStartY = e.touches[0].clientY;
    });

    swipeZone.addEventListener("touchend", (e) => {
      const touchEndY = e.changedTouches[0].clientY;
      if (touchStartY - touchEndY > 100 && selectedFile) {
        sendFile();
      }
    });

    function sendFile() {
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result;
        const fileData = {
          name: selectedFile.name,
          content: base64,
          timestamp: Date.now()
        };
        set(ref(db, 'sharedFile'), fileData);
        status.textContent = "Datei gesendet!";
      };
      reader.readAsDataURL(selectedFile);
    }

    onValue(ref(db, 'sharedFile'), (snapshot) => {
      const file = snapshot.val();
      if (file) {
        downloadZone.innerHTML = `
          <p>Datei empfangen: ${file.name}</p>
          <a href="${file.content}" download="${file.name}">
            <button>Herunterladen</button>
          </a>
        `;
        status.textContent = "Neue Datei empfangen!";
      }
    });
  </script>
</body>
</html>
