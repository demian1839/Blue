<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Swipe and Use</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(to top, #1e1e1e, #3a3a3a);
      font-family: sans-serif;
      color: white;
      height: 100vh;
      touch-action: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    input, button {
      margin: 10px;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
    }

    #swipeZone {
      background: #303030;
      border-radius: 12px;
      padding: 40px;
      margin-top: 20px;
      font-size: 18px;
      max-width: 90%;
      user-select: none;
    }

    #preview {
      margin-top: 20px;
      transition: transform 1s ease, opacity 1s ease;
    }

    .fly-up {
      transform: translateY(-200vh);
      opacity: 0;
    }

    .fly-in {
      transform: translateY(-200vh);
      animation: dropIn 1s ease forwards;
    }

    @keyframes dropIn {
      0% { transform: translateY(-200vh); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    #downloadZone {
      margin-top: 40px;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h2>Swipe and Use</h2>
    <input type="text" id="roomCode" placeholder="Raumcode (z. B. 1234)" />
    <input type="file" id="fileInput" />
    <div id="preview"></div>
    <div id="swipeZone">↑ Hochwischen zum Senden</div>
    <div id="status">Bereit</div>
    <div id="downloadZone"></div>
    <audio id="ding" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4GkHuMEBD4sqYkMj0etF1BZWi1LJy0h4",
      authDomain: "bluetooth-8693f.firebaseapp.com",
      projectId: "bluetooth-8693f",
      storageBucket: "bluetooth-8693f.firebasestorage.app",
      messagingSenderId: "564117531664",
      appId: "1:564117531664:web:0fb59351fdf6d1f08f2e95",
      measurementId: "G-SCKTS3WFXK",
      databaseURL: "https://bluetooth-8693f-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const fileInput = document.getElementById("fileInput");
    const swipeZone = document.getElementById("swipeZone");
    const status = document.getElementById("status");
    const downloadZone = document.getElementById("downloadZone");
    const preview = document.getElementById("preview");
    const roomCodeInput = document.getElementById("roomCode");
    const ding = document.getElementById("ding");

    let selectedFile = null;
    let touchStartY = 0;

    fileInput.addEventListener("change", (e) => {
      selectedFile = e.target.files[0];
      preview.innerHTML = "";
      if (selectedFile.type.startsWith("image/")) {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(selectedFile);
        img.style.maxWidth = "200px";
        img.style.borderRadius = "10px";
        preview.appendChild(img);
      } else {
        preview.innerHTML = `<p>${selectedFile.name}</p>`;
      }
      status.textContent = "Datei bereit – hochwischen zum Senden";
    });

    swipeZone.addEventListener("touchstart", (e) => {
      touchStartY = e.touches[0].clientY;
    });

    swipeZone.addEventListener("touchend", (e) => {
      const touchEndY = e.changedTouches[0].clientY;
      if (touchStartY - touchEndY > 100 && selectedFile && roomCodeInput.value.trim() !== "") {
        sendFile();
      }
    });

    function sendFile() {
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result;
        const fileData = {
          name: selectedFile.name,
          content: base64,
          type: selectedFile.type,
          timestamp: Date.now()
        };
        const room = roomCodeInput.value.trim();
        set(ref(db, `rooms/${room}/file`), fileData);
        if (preview.firstChild) {
          preview.firstChild.classList.add("fly-up");
        }
        status.textContent = "Datei gesendet!";
      };
      reader.readAsDataURL(selectedFile);
    }

    roomCodeInput.addEventListener("input", () => {
      const room = roomCodeInput.value.trim();
      if (room.length > 0) {
        onValue(ref(db, `rooms/${room}/file`), (snapshot) => {
          const file = snapshot.val();
          if (file) {
            showReceivedFile(file);
          }
        });
      }
    });

    function showReceivedFile(file) {
      downloadZone.innerHTML = "";
      const wrapper = document.createElement("div");
      wrapper.classList.add("fly-in");

      if (file.type.startsWith("image/")) {
        const img = document.createElement("img");
        img.src = file.content;
        img.style.maxWidth = "200px";
        img.style.borderRadius = "10px";
        wrapper.appendChild(img);
      }

      const link = document.createElement("a");
      link.href = file.content;
      link.download = file.name;
      link.innerHTML = `<button>⬇ ${file.name}</button>`;
      wrapper.appendChild(link);

      downloadZone.appendChild(wrapper);
      status.textContent = "Datei empfangen!";

      if (navigator.vibrate) navigator.vibrate(200);
      ding.play().catch(() => {});
    }
  </script>
</body>
</html>
